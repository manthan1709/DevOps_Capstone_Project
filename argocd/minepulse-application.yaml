apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minepulse-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/manthan1709/DevOps_Capstone_Project.git
    targetRevision: main
    path: helm/minepulse
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minepulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
