frontend:
  image: ghcr.io/manthan1709/minepulse-frontend
  tag: latest
backend:
  image: ghcr.io/manthan1709/minepulse-backend
  tag: latest
replicaCount: 2
namespace: minepulse
imagePullSecrets: []
postgres:
  host: minepulse-postgres
  database: minepulse_db
  username: admin
  password: admin123
ingress:
  enabled: false
  host: minepulse.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
