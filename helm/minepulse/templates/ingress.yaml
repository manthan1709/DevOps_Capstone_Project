{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: minepulse}
spec: 
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: minepulse-minepulse-backend, port: {number: 3019}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: minepulse-frontend, port: {number: 3030}}}}
{{- end }}
